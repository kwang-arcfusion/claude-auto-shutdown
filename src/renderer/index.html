<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>Claude Auto Shutdown</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Text in data-i18n / data-i18n-title / data-i18n-aria comes from src/shared/i18n.ts in the selected language. -->
    <main class="app">
      <header class="bar">
        <span class="brand">
          <img src="icon.svg" alt="" />
          Claude Auto Shutdown
        </span>
        <span id="dryBadge" class="pill" data-i18n="ui.test" data-i18n-title="ui.testTip" hidden>Test</span>
      </header>

      <section id="hero" class="hero" data-tone="off" aria-live="polite">
        <div id="phaseLabel" class="phase">…</div>
        <div id="bigTimer" class="timer" hidden>00:00</div>
        <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
        <div id="phaseSub" class="phase-sub"></div>
        <button id="primaryBtn" class="btn primary" type="button">Start watching</button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title" data-i18n="ui.sessions">Sessions</span>
          <button id="pollBtn" class="icon-btn poll" type="button" data-i18n-aria="ui.checkNow">
            <!-- Counts down to the next check: the arc empties clockwise, then refills after the check. -->
            <svg class="ring" viewBox="0 0 28 28" aria-hidden="true">
              <circle class="ring-track" cx="14" cy="14" r="12" />
              <circle id="pollRing" class="ring-left empty" cx="14" cy="14" r="12" transform="rotate(-90 14 14)" />
            </svg>
            <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.4 5.7" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
        </div>
        <p id="detectError" class="error" hidden></p>
        <ul id="sessionList" class="sessions"></ul>
        <p id="noSessions" class="faint empty" data-i18n="ui.noSessions" hidden>No open sessions</p>
      </section>

      <details class="panel">
        <summary class="panel-head">
          <span class="panel-title" data-i18n="ui.settings">Settings</span><span id="savedNote" class="saved" data-i18n="ui.saved" hidden>Saved</span>
        </summary>
        <form id="settingsForm" class="settings" autocomplete="off">
          <label class="row">
            <span data-i18n="ui.language">Language</span>
            <select name="language">
              <option value="en">English</option>
              <option value="th" lang="th">ไทย</option>
            </select>
          </label>
          <label class="row toggle" data-i18n-title="set.backgroundTip">
            <span data-i18n="set.background">Run in background</span>
            <input type="checkbox" name="runInBackground" />
          </label>
          <label class="row" data-i18n-title="set.pollTip">
            <span data-i18n="set.poll">Check every</span>
            <span class="num"><input type="number" name="pollIntervalSec" min="5" max="3600" step="1" /><em data-i18n="unit.sec">sec</em></span>
          </label>
          <label class="row" data-i18n-title="set.idleTip">
            <span data-i18n="set.idle">Idle for</span>
            <span class="num"><input type="number" name="idleConfirmMinutes" min="0" max="720" step="any" /><em data-i18n="unit.min">min</em></span>
          </label>
          <label class="row" data-i18n-title="set.countdownTip">
            <span data-i18n="set.countdown">Countdown</span>
            <span class="num"><input type="number" name="countdownMinutes" min="0" max="720" step="any" /><em data-i18n="unit.min">min</em></span>
          </label>
          <label class="row" data-i18n-title="set.waitingTip">
            <span data-i18n="set.waiting">Max wait for an answer</span>
            <span class="num"><input type="number" name="waitingMinutes" min="0" max="720" step="any" /><em data-i18n="unit.min">min</em></span>
          </label>
          <label class="row" data-i18n-title="set.toolStallTip">
            <span data-i18n="set.toolStall">Max stuck background</span>
            <span class="num"><input type="number" name="toolStallMinutes" min="0" max="1440" step="any" /><em data-i18n="unit.min">min</em></span>
          </label>
          <label class="row" data-i18n-title="set.stalledTip">
            <span data-i18n="set.stalled">Max silence</span>
            <span class="num"><input type="number" name="stalledMinutes" min="0" max="1440" step="any" /><em data-i18n="unit.min">min</em></span>
          </label>
          <label class="row">
            <span data-i18n="set.action">When time is up</span>
            <select name="action">
              <option value="shutdown" data-i18n="action.optShutdown">Shut down</option>
              <option value="hibernate" data-i18n="action.optHibernate">Hibernate</option>
              <option value="sleep" data-i18n="action.optSleep">Sleep</option>
            </select>
          </label>
          <label class="row toggle" data-i18n-title="set.forceTip">
            <span data-i18n="set.force">Force-close other apps</span>
            <input type="checkbox" name="forceCloseApps" />
          </label>
          <label class="row toggle" data-i18n-title="set.cancelOnActivityTip">
            <span data-i18n="set.cancelOnActivity">Cancel if someone uses the PC</span>
            <input type="checkbox" name="cancelOnUserActivity" />
          </label>
          <label class="row toggle" data-i18n-title="set.preventSleepTip">
            <span data-i18n="set.preventSleep">Keep the PC awake</span>
            <input type="checkbox" name="preventSleepWhileArmed" />
          </label>
          <label class="row toggle" data-i18n-title="set.dryRunTip">
            <span data-i18n="set.dryRun">Test mode</span>
            <input type="checkbox" name="dryRun" />
          </label>
          <details class="advanced">
            <summary data-i18n="ui.advanced">Advanced</summary>
            <label class="row" data-i18n-title="set.cpuTip">
              <span data-i18n="set.cpu">Background CPU</span>
              <span class="num"><input type="number" name="backgroundCpuPercent" min="0.5" max="100" step="any" /><em>%</em></span>
            </label>
            <label class="row stack" data-i18n-title="set.claudeDirTip">
              <span data-i18n="set.claudeDir">Claude folder</span>
              <input type="text" name="claudeDir" spellcheck="false" />
            </label>
            <button id="resetBtn" class="btn ghost small" type="button" data-i18n="ui.reset">Reset to defaults</button>
          </details>
        </form>
      </details>

      <details class="panel">
        <summary class="panel-head">
          <span class="panel-title" data-i18n="ui.log">Log</span><span class="faint" data-i18n="ui.logDays" data-i18n-title="ui.logDaysTip">7 days</span>
        </summary>
        <ol id="logList" class="log"></ol>
        <button id="logFolderBtn" class="btn ghost small" type="button" data-i18n="ui.openFolder">Open folder</button>
      </details>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
