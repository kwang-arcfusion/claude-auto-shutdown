<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>Claude Auto Shutdown</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <span class="brand">
          <img src="icon.svg" alt="" />
          Claude Auto Shutdown
        </span>
        <span id="dryBadge" class="pill" title="โหมดทดสอบ: ไม่ปิดเครื่องจริง" hidden>ทดสอบ</span>
      </header>

      <section id="hero" class="hero" data-tone="off" aria-live="polite">
        <div id="phaseLabel" class="phase">…</div>
        <div id="bigTimer" class="timer" hidden>00:00</div>
        <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
        <div id="phaseSub" class="phase-sub"></div>
        <button id="primaryBtn" class="btn primary" type="button">เริ่มเฝ้า</button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">Session</span>
          <span id="lastCheck" class="faint"></span>
          <button id="pollBtn" class="icon-btn" type="button" title="ตรวจเดี๋ยวนี้" aria-label="ตรวจเดี๋ยวนี้">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.4 5.7" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
        </div>
        <p id="detectError" class="error" hidden></p>
        <ul id="sessionList" class="sessions"></ul>
        <p id="noSessions" class="faint empty" hidden>ไม่มี session ที่เปิดอยู่</p>
      </section>

      <details class="panel">
        <summary class="panel-head"><span class="panel-title">ตั้งค่า</span><span id="savedNote" class="saved" hidden>บันทึกแล้ว</span></summary>
        <form id="settingsForm" class="settings" autocomplete="off">
          <label class="row" title="ความถี่ในการตรวจสถานะ Claude">
            <span>ตรวจทุก</span>
            <span class="num"><input type="number" name="pollIntervalSec" min="5" max="3600" step="1" /><em>วินาที</em></span>
          </label>
          <label class="row" title="Claude ต้องว่างต่อเนื่องนานเท่านี้ก่อนเริ่มนับถอยหลัง">
            <span>ว่างต่อเนื่อง</span>
            <span class="num"><input type="number" name="idleConfirmMinutes" min="0" max="720" step="any" /><em>นาที</em></span>
          </label>
          <label class="row" title="เวลานับถอยหลังก่อนปิดเครื่อง">
            <span>นับถอยหลัง</span>
            <span class="num"><input type="number" name="countdownMinutes" min="0" max="720" step="any" /><em>นาที</em></span>
          </label>
          <label class="row" title="session ที่สถานะ busy แต่เงียบนานเท่านี้ (เช่น ติดหน้าขออนุญาต) จะนับว่าเสร็จ · 0 = ไม่ใช้">
            <span>นับว่าค้างหลัง</span>
            <span class="num"><input type="number" name="stalledMinutes" min="0" max="1440" step="any" /><em>นาที</em></span>
          </label>
          <label class="row">
            <span>เมื่อครบเวลา</span>
            <select name="action">
              <option value="shutdown">Shutdown</option>
              <option value="hibernate">Hibernate</option>
              <option value="sleep">Sleep</option>
            </select>
          </label>
          <label class="row toggle" title="ปิดแอปอื่นที่ยังไม่ได้ save ด้วย (/f) ไม่อย่างนั้น Windows อาจค้างที่หน้าถามทั้งคืน">
            <span>บังคับปิดแอปอื่น</span>
            <input type="checkbox" name="forceCloseApps" />
          </label>
          <label class="row toggle" title="ขยับเมาส์หรือกดคีย์บอร์ดระหว่างนับถอยหลัง = ยกเลิก">
            <span>ยกเลิกเมื่อมีคนใช้เครื่อง</span>
            <input type="checkbox" name="cancelOnUserActivity" />
          </label>
          <label class="row toggle" title="กันไม่ให้ Windows sleep ระหว่างเฝ้า">
            <span>กันเครื่อง sleep</span>
            <input type="checkbox" name="preventSleepWhileArmed" />
          </label>
          <label class="row toggle" title="ไม่ปิดเครื่องจริง แค่บันทึกว่าจะสั่งอะไร">
            <span>โหมดทดสอบ</span>
            <input type="checkbox" name="dryRun" />
          </label>
          <details class="advanced">
            <summary>ขั้นสูง</summary>
            <label class="row" title="CPU รวมของ process ใต้ session ที่ไม่ใช่คำสั่งของ Claude (เช่น MCP server) ที่ถือว่ายังทำงาน">
              <span>CPU เบื้องหลัง</span>
              <span class="num"><input type="number" name="backgroundCpuPercent" min="0.5" max="100" step="any" /><em>%</em></span>
            </label>
            <label class="row stack" title="เว้นว่าง = ใช้ค่าอัตโนมัติ">
              <span>โฟลเดอร์ Claude</span>
              <input type="text" name="claudeDir" spellcheck="false" />
            </label>
            <button id="resetBtn" class="btn ghost small" type="button">คืนค่าเริ่มต้น</button>
          </details>
        </form>
      </details>

      <details class="panel">
        <summary class="panel-head"><span class="panel-title">บันทึก</span><span class="faint" title="เก็บไว้ใน SQLite 30 วัน">30 วัน</span></summary>
        <ol id="logList" class="log"></ol>
        <button id="logFolderBtn" class="btn ghost small" type="button">เปิดโฟลเดอร์</button>
      </details>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
